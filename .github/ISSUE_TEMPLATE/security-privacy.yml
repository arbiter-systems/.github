name: Security or privacy issue
description: Track public-safe security or privacy hardening work. Do not report private vulnerabilities here.
title: "security: "
labels: ["area/security"]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form for private vulnerability reports, exploit details, credentials, tokens, provider keys, incident details, private links, customer data, raw prompts, provider payloads, or local logs. Use the security policy for sensitive reports.
  - type: input
    id: affected_repo
    attributes:
      label: Affected repository or area
      placeholder: control-plane-api, ai-execution-service, arbiter-console, arbiter-site, .github, company, or security
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Public-safe summary
      description: Describe the hardening or privacy work without sensitive detail.
    validations:
      required: true
  - type: dropdown
    id: report_type
    attributes:
      label: Issue type
      options:
        - hardening
        - policy/documentation
        - privacy review
        - dependency or configuration review
        - other public-safe work
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this matters. Keep details public-safe.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      value: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      value: |
        - No private vulnerability disclosure in this public issue.
        - No secrets, exploit steps, customer data, raw prompts, or provider payloads.
        - No Project field hydration or issue-body backfilling.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Suggested validation
      description: Public-safe commands or manual checks only.
    validations:
      required: true
  - type: textarea
    id: privacy_boundary
    attributes:
      label: Privacy and disclosure boundary
      description: Confirm why this can remain public or note that sensitive details are tracked privately.
    validations:
      required: true
  - type: dropdown
    id: readiness
    attributes:
      label: Implementation readiness
      options:
        - ready
        - needs-clarification
        - blocked
        - discovery-only
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: Dependencies or blockers
      placeholder: None
