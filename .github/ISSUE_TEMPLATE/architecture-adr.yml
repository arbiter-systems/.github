name: Architecture or ADR issue
description: Propose or track an architecture decision, boundary, or design record.
title: "arch: "
labels: ["area/architecture"]
body:
  - type: markdown
    attributes:
      value: |
        Use public-safe wording only. Do not include secrets, private topology details, provider credentials, raw prompts, customer data, private roadmap details, or unsupported product claims.
  - type: input
    id: affected_repo
    attributes:
      label: Affected repository or system boundary
      placeholder: control-plane-api, ai-execution-service, arbiter-console, arbiter-site, .github, company, or security
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Decision or architecture summary
      description: What decision, boundary, or design needs to be made or documented?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and forces
      description: Describe the constraints, tradeoffs, and drivers in public-safe terms.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options considered
      value: |
        - Option A: ...
        - Option B: ...
        - Option C: ...
    validations:
      required: true
  - type: textarea
    id: proposed_decision
    attributes:
      label: Proposed decision
      description: State the preferred direction if known.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      value: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      value: |
        - No broad rewrite unless explicitly approved.
        - No Project field hydration or issue-body backfilling.
        - No private implementation runbooks in public docs.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] Decision is documented.
        - [ ] Tradeoffs are captured.
        - [ ] Follow-up implementation issues are linked when needed.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Suggested validation
      description: Manual review, docs checks, architecture tests, or repo-specific commands.
    validations:
      required: true
  - type: textarea
    id: security_privacy
    attributes:
      label: Security and privacy considerations
      placeholder: Public-safe only; no sensitive architecture details, secrets, raw prompts, or customer data.
    validations:
      required: true
  - type: dropdown
    id: readiness
    attributes:
      label: Implementation readiness
      options:
        - ready
        - needs-clarification
        - blocked
        - discovery-only
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: Dependencies or blockers
      placeholder: None
