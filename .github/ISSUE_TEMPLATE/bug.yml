name: Bug issue
description: Report a defect, regression, or broken expected behavior.
title: "fix: "
labels: ["type/bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use public-safe wording only. Do not paste secrets, tokens, provider keys, raw prompts, customer data, provider payloads, private links, local logs, stack traces with sensitive paths, or incident details.
  - type: input
    id: affected_repo
    attributes:
      label: Affected repository or area
      placeholder: control-plane-api, ai-execution-service, arbiter-console, arbiter-site, .github, company, or security
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Keep this public-safe. Summarize logs instead of pasting sensitive output.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction or evidence
      description: Provide safe reproduction steps or sanitized evidence.
      value: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What should be fixed in this issue?
      value: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      value: |
        - No unrelated refactors.
        - No Project field hydration or issue-body backfilling.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Suggested validation
      placeholder: |
        ```bash
        npm test
        ```
    validations:
      required: true
  - type: textarea
    id: security_privacy
    attributes:
      label: Security and privacy considerations
      placeholder: Public-safe only; no raw prompts, secrets, customer data, logs, or provider payloads.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - blocker
        - high
        - medium
        - low
    validations:
      required: true
  - type: dropdown
    id: readiness
    attributes:
      label: Implementation readiness
      options:
        - ready
        - needs-clarification
        - blocked
        - discovery-only
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: Dependencies or blockers
      placeholder: None
