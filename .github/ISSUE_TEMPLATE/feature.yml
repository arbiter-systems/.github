name: Feature issue
description: Propose scoped product, service, console, site, or operations feature work.
title: "feat: "
labels: ["type/feature"]
body:
  - type: markdown
    attributes:
      value: |
        Use public-safe wording only. Do not include secrets, provider keys, raw prompts, customer data, provider payloads, private roadmap details, incident data, or unsupported compliance, savings, customer, or hosted-demo claims.
  - type: input
    id: affected_repo
    attributes:
      label: Affected repository or area
      placeholder: control-plane-api, ai-execution-service, arbiter-console, arbiter-site, .github, company, or security
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two public-safe sentences describing the feature.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this matters and what problem it solves.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Concrete work included in this issue.
      value: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: Explicitly list what should not be changed.
      value: |
        - No unrelated refactors.
        - No Project field hydration or issue-body backfilling.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Suggested validation
      description: Commands, manual checks, or review steps.
      placeholder: |
        ```bash
        npm test
        ```
    validations:
      required: true
  - type: textarea
    id: security_privacy
    attributes:
      label: Security and privacy considerations
      description: Note sensitive-data boundaries or why none apply.
      placeholder: Public-safe only; no raw prompts, secrets, customer data, logs, or provider payloads.
    validations:
      required: true
  - type: dropdown
    id: release_gate
    attributes:
      label: MVP or release gate relevance
      options:
        - local-mvp
        - hosted-demo
        - private-beta
        - post-mvp
        - not-release-gated
    validations:
      required: true
  - type: dropdown
    id: readiness
    attributes:
      label: Implementation readiness
      options:
        - ready
        - needs-clarification
        - blocked
        - discovery-only
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: Dependencies or blockers
      placeholder: None
