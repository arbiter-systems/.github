name: Ready task
description: Create a scoped task with clear acceptance criteria and validation.
title: "chore: "
labels: ["type/chore"]
body:
  - type: markdown
    attributes:
      value: |
        Keep the issue public-safe and scoped.
  - type: input
    id: affected_repo
    attributes:
      label: Affected repository or area
      placeholder: control-plane-api, ai-execution-service, arbiter-console, arbiter-site, .github, company, or security
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One sentence describing the task.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this task exists.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      value: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      value: |
        - No unrelated refactors.
        - No broad issue migration.
        - No metadata automation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Required validation
      placeholder: npm test
    validations:
      required: true
  - type: dropdown
    id: release_gate
    attributes:
      label: MVP or release gate relevance
      options:
        - local-mvp
        - hosted-demo
        - private-beta
        - post-mvp
        - not-release-gated
    validations:
      required: true
  - type: dropdown
    id: readiness
    attributes:
      label: Readiness
      options:
        - ready
        - needs-clarification
        - blocked
        - discovery-only
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: Dependencies or blockers
      placeholder: None
