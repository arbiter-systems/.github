name: Test issue
description: Track test coverage, regression tests, contract tests, or validation-only work.
title: "test: "
labels: ["type/test"]
body:
  - type: markdown
    attributes:
      value: |
        Use public-safe wording only. Do not include secrets, raw prompts, customer data, provider payloads, private links, local logs, or environment dumps.
  - type: input
    id: affected_repo
    attributes:
      label: Affected repository or area
      placeholder: control-plane-api, ai-execution-service, arbiter-console, arbiter-site, .github, company, or security
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What test or validation gap should be closed?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this test matters and what risk it reduces.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      value: |
        - [ ] Add or update ...
        - [ ] Verify ...
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      value: |
        - No runtime behavior changes unless required to make the testable contract explicit.
        - No Project field hydration or issue-body backfilling.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] Test coverage exists for the stated scenario.
        - [ ] Test fails for the old/broken behavior when applicable.
        - [ ] Validation command is documented.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Suggested validation
      placeholder: |
        ```bash
        dotnet test
        pytest
        npm test
        ```
    validations:
      required: true
  - type: textarea
    id: security_privacy
    attributes:
      label: Security and privacy considerations
      placeholder: Confirm fixtures are synthetic and public-safe.
    validations:
      required: true
  - type: dropdown
    id: readiness
    attributes:
      label: Implementation readiness
      options:
        - ready
        - needs-clarification
        - blocked
        - discovery-only
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: Dependencies or blockers
      placeholder: None
