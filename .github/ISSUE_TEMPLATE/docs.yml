name: Docs issue
description: Track public-safe documentation changes.
title: "docs: "
labels: ["type/docs"]
body:
  - type: markdown
    attributes:
      value: |
        Use public-safe wording only. Do not include private roadmap details, internal implementation sequencing, raw prompts, provider payloads, customer data, private links, or unsupported compliance/savings/customer claims.
  - type: input
    id: affected_docs
    attributes:
      label: Affected docs or repository area
      placeholder: docs/engineering/testing-standard.md, AGENTS.md, README.md, .github templates
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What documentation should change?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this doc change needed?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      value: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      value: |
        - No runtime code changes.
        - No Project field hydration or issue-body backfilling.
        - No private runbooks or sensitive implementation details in public docs.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Suggested validation
      placeholder: |
        ```bash
        npx prettier --check "**/*.{md,yml,yaml,json}"
        ```
    validations:
      required: true
  - type: textarea
    id: security_privacy
    attributes:
      label: Public/private boundary check
      placeholder: Confirm this doc change does not expose secrets, raw prompts, customer data, provider payloads, private planning, or unsupported claims.
    validations:
      required: true
  - type: dropdown
    id: release_gate
    attributes:
      label: MVP or release gate relevance
      options:
        - local-mvp
        - hosted-demo
        - private-beta
        - post-mvp
        - not-release-gated
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: Dependencies or blockers
      placeholder: None
