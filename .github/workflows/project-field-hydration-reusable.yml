name: Project Field Hydration Reusable

on:
  workflow_call:
    inputs:
      repo:
        description: "Repository containing the issue that would have been hydrated"
        required: true
        type: string
      issue_number:
        description: "Issue number that would have been hydrated"
        required: true
        type: string
      project:
        description: "Retired project reference, retained for backward-compatible callers"
        required: false
        type: string
        default: "arbiter-systems/2"
      dry_run:
        description: "Retired dry-run flag, retained for backward-compatible callers"
        required: false
        type: string
        default: "true"

permissions:
  contents: read
  issues: read

jobs:
  hydration-retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retired hydration
        run: |
          echo "Project field hydration is retired for Arbiter Systems planning."
          echo "Requested repo: ${{ inputs.repo }}"
          echo "Requested issue: ${{ inputs.issue_number }}"
          echo "Use labels, milestones, issue body sections, and manual triage instead."
          echo "See docs/project-field-hydration-retirement.md in arbiter-systems/.github."
