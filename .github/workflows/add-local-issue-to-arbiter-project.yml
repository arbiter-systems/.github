name: Add local issue to Arbiter Project

on:
  issues:
    types: [opened, reopened, unlabeled]

permissions:
  contents: read

jobs:
  add-to-project:
    name: Add issue to Arbiter Project
    if: ${{ !contains(github.event.issue.labels.*.name, 'no-project') }}
    uses: ./.github/workflows/add-issue-to-arbiter-project.yml
    secrets:
      ARBITER_PROJECTS_TOKEN: ${{ secrets.ARBITER_PROJECTS_TOKEN }}
