name: Add issue to Arbiter Project

on:
  workflow_call:
    inputs:
      project-url:
        description: GitHub Projects URL for the Arbiter execution board.
        required: false
        type: string
        default: https://github.com/orgs/arbiter-systems/projects/2
      skip-label:
        description: Label that intentionally excludes an issue from project auto-add.
        required: false
        type: string
        default: no-project
    secrets:
      PROJECT_AUTOMATION_APP_ID:
        description: GitHub App client ID for project automation.
        required: true
      PROJECT_AUTOMATION_PRIVATE_KEY:
        description: Private key for the project automation GitHub App.
        required: true

permissions:
  contents: read

jobs:
  add-issue:
    name: Add issue to project
    if: ${{ github.event.issue != null && !contains(github.event.issue.labels.*.name, inputs.skip-label) }}
    runs-on: ubuntu-latest
    steps:
      - name: Create project automation app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PROJECT_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.PROJECT_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-organization-projects: write
          permission-issues: read
          permission-pull-requests: read

      - name: Add issue to Arbiter Project
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: ${{ inputs.project-url }}
          github-token: ${{ steps.app-token.outputs.token }}
